# Starship com a paleta Cyber Arch (baseado em github.com/V1xEr3bus/Cyber-Arch)
# vermelho #ff003c · ciano #00f0ff · amarelo #fcee09 · verde #00ff9c · roxo #d57bff
"$schema" = "https://starship.rs/config-schema.json"

format = """
$directory$git_branch$git_status$nodejs$python$rust$golang$java$docker_context$cmd_duration
$character"""
add_newline = true

[character]
success_symbol = "[➤](bold #ff003c)"
error_symbol = "[✗](bold #fcee09)"
vimcmd_symbol = "[❮](bold #00f0ff)"

[directory]
style = "bold #fcee09"
read_only = " "
read_only_style = "#ff003c"
truncation_length = 4
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold #00f0ff"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #ff003c"
format = "([\\[$all_status$ahead_behind\\]]($style) )"

[cmd_duration]
min_time = 2000
style = "#d57bff"
format = "[ $duration]($style) "

[nodejs]
symbol = " "
style = "bold #00ff9c"

[python]
symbol = " "
style = "bold #fcee09"

[rust]
symbol = "\U000F1617 "
style = "bold #ff003c"

[golang]
symbol = " "
style = "bold #00f0ff"

[java]
symbol = " "
style = "bold #ff003c"

[docker_context]
symbol = " "
style = "bold #00f0ff"

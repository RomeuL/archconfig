# Na tomada a tela não escurece, não apaga e o notebook não suspende;
# na bateria vale o fluxo normal. O bloqueio aos 5 min vale nos dois casos.
# (on-battery.sh: verdadeiro só quando o carregador está desconectado)

general {
    lock_cmd = pidof hyprlock || hyprlock                             # evita abrir dois hyprlock
    before_sleep_cmd = loginctl lock-session                          # bloqueia antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # liga a tela ao voltar da suspensão
}

listener {
    timeout = 150                                       # 2,5 min: escurece (só na bateria)
    on-timeout = ~/.config/hypr/scripts/idle-dim.sh on
    on-resume = ~/.config/hypr/scripts/idle-dim.sh off
}

listener {
    timeout = 300                                       # 5 min: bloqueia a tela
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                       # 5,5 min: apaga a tela (só na bateria)
    on-timeout = ~/.config/hypr/scripts/on-battery.sh && hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800                                      # 30 min: suspende (só na bateria)
    on-timeout = ~/.config/hypr/scripts/on-battery.sh && systemctl suspend
}

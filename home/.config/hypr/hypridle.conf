# Bloqueia aos 5 min e mostra animações enquanto a tela estiver ligada.
# Na tomada a tela permanece ligada; na bateria apaga aos 10 min e suspende aos 30.
# arch-lock usa Hyprlock até o bloqueio animado ser instalado e ativado.
# (on-battery.sh: verdadeiro só quando o carregador está desconectado)

general {
    lock_cmd = ~/.local/bin/arch-lock                                # evita bloqueios duplicados
    inhibit_sleep = 3                                               # aguarda o bloqueio Wayland antes de suspender
    before_sleep_cmd = loginctl lock-session                          # bloqueia antes de suspender
    after_sleep_cmd = ~/.local/bin/arch-lock screen-on                # liga a tela e retoma as animações
}

listener {
    timeout = 150                                       # 2,5 min: escurece (só na bateria)
    on-timeout = ~/.config/hypr/scripts/idle-dim.sh on
    on-resume = ~/.config/hypr/scripts/idle-dim.sh off
}

listener {
    timeout = 300                                       # 5 min: bloqueia a tela
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600                                       # 10 min: apaga a tela (só na bateria)
    on-timeout = ~/.local/bin/arch-lock screen-off        # pausa as animações enquanto a tela está apagada
    on-resume = ~/.local/bin/arch-lock screen-on
}

listener {
    timeout = 1800                                      # 30 min: suspende (só na bateria)
    on-timeout = ~/.config/hypr/scripts/on-battery.sh && systemctl suspend
}
